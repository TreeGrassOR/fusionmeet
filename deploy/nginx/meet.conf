# FusionMeet router, mounted into the frontend container (deploy/compose.yaml).
#
# Based on docker/files/production/default.conf.template (SPA + /api, /admin,
# /static -> backend) and on the media blocks of
# docker/files/etc/nginx/conf.d/default.conf (auth_request for recordings).
# Caddy terminates TLS and forwards meet.<BASE_DOMAIN> here.

server {
    listen 8083;
    server_name _;
    charset utf-8;

    # Disables server version feedback on pages and in headers
    server_tokens off;

    # Resolve service names at request time through Docker's embedded DNS, so a
    # recreated backend or garage container (new IP) works without an nginx restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $meet_backend http://backend:8000;
    set $meet_frontend http://127.0.0.1:8080;
    set $meet_garage http://garage:3900;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_redirect off;

    # SPA: the image's own nginx server on :8080 (src/frontend/default.conf)
    location / {
        proxy_pass $meet_frontend;
    }

    location /api {
        proxy_pass $meet_backend;
    }

    location /admin {
        proxy_pass $meet_backend;
    }

    location /static {
        proxy_pass $meet_backend;
    }

    # Recordings: the backend authorizes the request and returns S3 SigV4 headers
    # signed for http://garage:3900/<bucket>/recordings/<file>
    location /media/recordings/ {
        auth_request /media-auth-recordings;
        auth_request_set $auth_header $upstream_http_authorization;
        auth_request_set $auth_date $upstream_http_x_amz_date;
        auth_request_set $auth_content_sha256 $upstream_http_x_amz_content_sha256;

        proxy_set_header Authorization $auth_header;
        proxy_set_header X-Amz-Date $auth_date;
        proxy_set_header X-Amz-Content-SHA256 $auth_content_sha256;
        # Must be the host:port of the backend's AWS_S3_ENDPOINT_URL (signed)
        proxy_set_header Host garage:3900;
        # The session cookie is not needed by S3
        proxy_set_header Cookie "";

        proxy_hide_header Content-Disposition;
        add_header Content-Disposition "attachment";

        # Stream large files instead of buffering them to disk
        proxy_buffering off;
        proxy_read_timeout 300s;

        rewrite ^/media/recordings/(.*)$ /meet-media-storage/recordings/$1 break;
        proxy_pass $meet_garage;
    }

    location = /media-auth-recordings {
        internal;
        proxy_pass $meet_backend/api/v1.0/recordings/media-auth/;
        # Production Django: allowed Host and HTTPS scheme, or it redirects
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Original-URL $request_uri;
        proxy_set_header X-Original-Method $request_method;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}
