<!doctype html>
<html lang="ru" data-lk-theme="visio-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Set the light/dark theme before the CSS loads, to avoid a flash.
      // Same rules as src/stores/theme.ts and src/hooks/useApplyTheme.ts.
      (function () {
        try {
          var p = localStorage.getItem('app_theme')
          var dark =
            p === 'dark' ||
            (p !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (/^\/sdk(\/|$)/.test(location.pathname)) dark = false
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'dark' : 'light'
          )
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#161622')
          }
        } catch (e) {}
      })()
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
